name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: development
      METHOD: local
      MODE: play
      IS_HTTPS: "false"
      BOX_BUNDLED_CONTENT_PATH: ${{ github.workspace }}/test-fixtures/blobs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: pnpm install --frozen-lockfile
      - name: Go CLI
        working-directory: cli
        run: |
          go vet ./...
          go build -o /tmp/feather .
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:protocol
      - run: pnpm test:daemon
